# Builds Arduino's AVR toolchain in WebAssembly, the package @silinx/avr-gcc (packages/silinx-avr-gcc, #5934), and publishes it
# on npm when its own version tag (silinx-avr-gcc-v0.1.0) is pushed, as silinx-pic24-release.yml publishes the PIC24
# emulator's. Its build (packages/silinx-avr-gcc/build/build.sh: pinned sources, each checked by its SHA-256, and a pinned
# Emscripten) then its oracle (build/oracle.mjs): every sketch of build/oracle/ built by the WebAssembly tools and by Arduino's
# native Linux toolchain with the same flags, the same .hex byte for byte; then the package's own tests on the built package
# (test/silinx-avr-gcc*.test.js). On a pull request that changes the package's build or this workflow: the build, its oracle
# and its tests, the package an artifact (the PR description reports its size and times). On the tag: the same, the tagged
# commit on main, its version the tag's with its changelog section (scripts/sync-version.mjs --package), then npm's
# publish with provenance. No token: npm's trusted publishing authenticates this workflow by GitHub's OIDC token, the
# package's trusted publisher on npmjs.com being this repository and this workflow (npm 11.5.1 or later, pinned by its
# tarball's integrity, #3049). The OIDC token is the publish job's only (#2644). By hand (Actions ▸ silinx-avr-gcc ▸ Run
# workflow): the build, its oracle and tests on the chosen branch, main's before its tag; nothing published.
name: silinx-avr-gcc
on:
  pull_request:
    paths: [packages/silinx-avr-gcc/build/**, .github/workflows/silinx-avr-gcc.yml]
  push:
    tags: ['silinx-avr-gcc-v*']
  workflow_dispatch:    # (by hand: the build, its oracle and tests on a branch's code, main's before a tag; no publishing)
permissions:
  contents: read
concurrency:
  group: silinx-avr-gcc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The commit is on main, its version the tag's
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          V="${GITHUB_REF_NAME#silinx-avr-gcc-v}"
          test "$(node -p "require('./packages/silinx-avr-gcc/package.json').version")" = "$V" || { echo "packages/silinx-avr-gcc/package.json is not $V"; exit 1; }
          node scripts/sync-version.mjs --package silinx-avr-gcc
      - uses: ./.github/actions/setup
      - name: Build
        run: packages/silinx-avr-gcc/build/build.sh "$RUNNER_TEMP/work" packages/silinx-avr-gcc/dist
      # (the sketches by the WebAssembly tools and by Arduino's native toolchain, the build's own downloads)
      - name: Oracle
        run: node packages/silinx-avr-gcc/build/oracle.mjs packages/silinx-avr-gcc/dist "$RUNNER_TEMP/work/toolchain" "$RUNNER_TEMP/work/core"
      - name: The package's tests
        run: node --test test/silinx-avr-gcc*.test.js
        shell: bash
      - name: Pack
        run: |
          mkdir -p out && npm pack -w @silinx/avr-gcc --ignore-scripts --pack-destination out
          ls -la out && du -sh packages/silinx-avr-gcc/dist/tools packages/silinx-avr-gcc/dist/sysroot packages/silinx-avr-gcc/dist/arduino
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silinx-avr-gcc
          path: out
          retention-days: 7
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/silinx-avr-gcc-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write         # npm's trusted publishing and provenance (GitHub's OIDC token)
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: silinx-avr-gcc
          path: out
      # npm 11.21.0, its tarball checked against the integrity pinned here, then installed from that file (#3049)
      - name: Publish
        env:
          NPM_TARBALL: https://registry.npmjs.org/npm/-/npm-11.21.0.tgz
          NPM_INTEGRITY: sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==
        run: |
          curl -fsSL -o "$RUNNER_TEMP/npm.tgz" "$NPM_TARBALL"
          test "sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/npm.tgz" | base64 -w0)" = "$NPM_INTEGRITY" || { echo "::error::$NPM_TARBALL is not the tarball of its pinned integrity"; exit 1; }
          npm install --global "$RUNNER_TEMP/npm.tgz" --ignore-scripts --no-audit --no-fund
          npm --version
          npm publish ./out/silinx-avr-gcc-*.tgz --provenance --access public --ignore-scripts --loglevel verbose
