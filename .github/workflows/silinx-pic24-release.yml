# Publishes the PIC24 emulator's package, silinx-pic24 (packages/silinx-pic24, #5480), on npm when its own version tag
# (silinx-pic24-v0.1.0) is pushed (#5509), as silinx-fpga-release.yml publishes the toolchain's package (#1681), with
# npm's provenance: a signed statement that the package was built here, by this workflow, from this tag (npm audit
# signatures, or the package's page on npmjs.com). The package's own tests are run here (test/pic24-*.test.js and
# test/silinx-pic24-package.test.js, which import the package alone), not Silinx's whole CI: CI, started by the same
# tag, still runs everything, but a break of the IDE outside the package does not hold the package's release (#5595:
# 0.2.0, 0.3.0 and 0.3.1 were held so). The tagged commit must be on main, its package's version the tag's, with its changelog section and no fragment left (scripts/sync-version.mjs
# --package). No token: npm's trusted publishing authenticates this workflow by GitHub's OIDC token, the package's
# trusted publisher on npmjs.com being this repository and this workflow; it needs npm 11.5.1 or later (Node 22's is
# npm 10), pinned here by its tarball's integrity (#3049). No GitHub Release. The OIDC token is the publish job's only
# (#2644): the build job, which installs the dependencies and runs the repository's code, packs the package and holds
# none; the publish job runs only npm, on that tarball.
name: silinx-pic24 release
on:
  push:
    tags: ['silinx-pic24-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: ./.github/actions/setup
      - name: The tag's version, with its changelog
        run: |
          V="${GITHUB_REF_NAME#silinx-pic24-v}"
          test "$(node -p "require('./packages/silinx-pic24/package.json').version")" = "$V" || { echo "packages/silinx-pic24/package.json is not $V"; exit 1; }
          node scripts/sync-version.mjs --package silinx-pic24
      # the package's own tests (#5595): the emulator's, which import packages/silinx-pic24 only, and the package's
      # (its files, its exports); a failure: no release
      - name: The package's tests
        run: node --test test/pic24-*.test.js test/silinx-pic24-package.test.js
        shell: bash
      - name: Pack
        run: mkdir -p out && npm pack -w silinx-pic24 --ignore-scripts --pack-destination out && ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silinx-pic24
          path: out
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write         # npm's trusted publishing and provenance (GitHub's OIDC token)
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: silinx-pic24
          path: out
      # npm 11.21.0 (its dependencies bundled in its tarball): the tarball checked against the integrity pinned here
      # (npm view npm@11.21.0 dist.integrity), then installed from that file, before the job's token publishes (#3049);
      # the npm that publishes and its verbose log, which says why the OIDC token's exchange failed (#3889)
      - name: Publish
        env:
          NPM_TARBALL: https://registry.npmjs.org/npm/-/npm-11.21.0.tgz
          NPM_INTEGRITY: sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==
        run: |
          curl -fsSL -o "$RUNNER_TEMP/npm.tgz" "$NPM_TARBALL"
          test "sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/npm.tgz" | base64 -w0)" = "$NPM_INTEGRITY" || { echo "::error::$NPM_TARBALL is not the tarball of its pinned integrity"; exit 1; }
          npm install --global "$RUNNER_TEMP/npm.tgz" --ignore-scripts --no-audit --no-fund
          npm --version
          npm publish ./out/silinx-pic24-*.tgz --provenance --access public --ignore-scripts --loglevel verbose
